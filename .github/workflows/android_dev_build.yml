name: Build development release from source

on:
  push:
    branches: [main]
    paths: ['dev.txt']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag or commit
        default: main
        required: true
      mirror_source:
        description: Also publish to NikGapps during migration
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: public-dev-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release controls
        uses: actions/checkout@v4
        with:
          path: release-control
          persist-credentials: false

      - name: Read public release version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < release-control/dev.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          echo "PUBLIC_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 -m unittest discover -s release-control/.github/scripts -p 'test_*.py'
          cp release-control/.github/scripts/validate_changelog.py "$RUNNER_TEMP/validate_changelog.py"
          cp release-control/.github/scripts/normalize_apk_signing.py "$RUNNER_TEMP/normalize_apk_signing.py"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: nikhilmenghani/NikGapps
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.AUTH }}
          persist-credentials: false

      - name: Validate source changelog
        run: python3 "$RUNNER_TEMP/validate_changelog.py" "$PUBLIC_RELEASE_VERSION" CHANGELOG.md

      - name: Record source revision
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read development version
        shell: bash
        run: |
          DEV_VERSION="$PUBLIC_RELEASE_VERSION"
          if [[ ! "$DEV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dev.txt must contain a semantic version such as 0.80.1"
            exit 1
          fi

          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "$DEV_VERSION"
          VERSION_CODE=$((10#$V_MAJOR * 1000000 + 10#$V_MINOR * 1000 + 10#$V_PATCH))

          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"
          echo "DEV_TAG=dev-v$DEV_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Apply development version
        shell: bash
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${DEV_VERSION}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts

      - name: Configure signing key for development APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "The existing KEYSTORE and KEYSTORE_PASSWORD GitHub secrets are required."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nikgapps-dev.keystore"

          KEY_ALIAS=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/nikgapps-dev.keystore" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD | \
            sed -n 's/^Alias name: //p' | head -n 1)

          if [[ -z "$KEY_ALIAS" ]]; then
            echo "Could not determine the signing-key alias from KEYSTORE."
            exit 1
          fi
          echo "DEV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed debug APK
        env:
          DEV_KEYSTORE_PATH: ${{ runner.temp }}/nikgapps-dev.keystore
          DEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          NIKGAPPS_CLIENT_ID: ${{ secrets.NIKGAPPS_CLIENT_ID }}
        run: |
          if [[ -z "$NIKGAPPS_CLIENT_ID" ]]; then
            echo "NIKGAPPS_CLIENT_ID secret is required for GitHub sign-in."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --build-cache --parallel

      - name: Install tested APK signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0"'

      - name: Normalize and verify APK signing
        env:
          APK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 "$RUNNER_TEMP/normalize_apk_signing.py" \
            --input app/build/outputs/apk/debug/app-debug.apk \
            --output app/build/outputs/apk/debug/app-normalized.apk \
            --keystore "$RUNNER_TEMP/nikgapps-dev.keystore" \
            --alias "$DEV_KEY_ALIAS" \
            --apksigner "$ANDROID_HOME/build-tools/36.1.0/apksigner" \
            --expected-certificate cca3e6aed9650ae8529bb90c845cd7f77dce41e59f5d81e3b9555adb0984caf7 \
            --report "$RUNNER_TEMP/apk-signing-verification.json"

      - name: Rename APK
        shell: bash
        run: |
          mv app/build/outputs/apk/debug/app-normalized.apk \
             "app/build/outputs/apk/debug/NikGapps-debug-${DEV_TAG}.apk"

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          repository: nikhilmenghani/NikGappsReleases
          token: ${{ secrets.AUTH }}
          files: |
            app/build/outputs/apk/debug/NikGapps-debug-${{ env.DEV_TAG }}.apk
            CHANGELOG.md
          tag_name: ${{ env.DEV_TAG }}
          name: ${{ env.DEV_VERSION }}
          prerelease: true
          fail_on_unmatched_files: true

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nikgapps-dev.keystore"

      - name: Synchronize public changelog
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTH }}
          script: |
            const fs = require('fs');
            const owner = 'nikhilmenghani', repo = 'NikGappsReleases', path = 'CHANGELOG.md';
            const content = fs.readFileSync(path).toString('base64');
            let previous;
            try { previous = (await github.rest.repos.getContent({owner, repo, path, ref: 'main'})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (previous?.content?.replace(/\s/g, '') !== content) {
              await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch: 'main',
                message: 'Update public changelog', content, ...(previous ? {sha: previous.sha} : {})});
            }

      - name: Publish migration copy to source repository
        if: github.event_name == 'push' || inputs.mirror_source
        uses: softprops/action-gh-release@v2
        with:
          repository: nikhilmenghani/NikGapps
          token: ${{ secrets.AUTH }}
          target_commitish: ${{ env.SOURCE_COMMIT }}
          files: app/build/outputs/apk/debug/NikGapps-debug-${{ env.DEV_TAG }}.apk
          tag_name: ${{ env.DEV_TAG }}
          name: ${{ env.DEV_VERSION }}
          prerelease: true
          fail_on_unmatched_files: true
