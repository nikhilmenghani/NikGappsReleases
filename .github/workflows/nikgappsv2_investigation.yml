name: NikGappsv2 investigation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full NikGappsv2 source commit
        required: true
      tag:
        description: Immutable experimental tag
        required: true
      signing:
        type: choice
        options: [normalized, ordinary]
        default: normalized
permissions:
  contents: read
jobs:
  release:
    uses: nikhilmenghani/NikGappsv2/.github/workflows/release.yml@7db1d9350876f74e3dca7d42c57d0c073ee05fc9
    with:
      source_ref: ${{ inputs.source_ref }}
      tag: ${{ inputs.tag }}
      signing: ${{ inputs.signing }}
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.AUTH }}
